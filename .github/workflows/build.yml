name: Build BlogHero Desktop App

# Builds a Windows .exe (on a real GitHub-hosted Windows machine) and a Mac
# .app (on a real GitHub-hosted Mac machine) automatically. Nobody needs
# Python, PyInstaller, or a terminal to get the finished app - just download
# the right file from this workflow's Releases page once it finishes.
#
# Triggers: push a version tag (e.g. `git tag v1.0 && git push --tags`),
# or run manually from the Actions tab ("Run workflow" button).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --windowed --name BlogHero
          --add-data "static;static"
          --add-data "config.env.example;."
          --add-data "data;data"
          --collect-all numpy
          --collect-all pandas
          desktop.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BlogHero-Windows
          path: dist/BlogHero.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Mac app bundle
        run: >
          pyinstaller --windowed --name BlogHero
          --add-data "static:static"
          --add-data "config.env.example:."
          --add-data "data:data"
          --collect-all numpy
          --collect-all pandas
          desktop.py

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r BlogHero-Mac.zip BlogHero.app

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: BlogHero-Mac
          path: dist/BlogHero-Mac.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with both builds attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BlogHero-Windows/BlogHero.exe
            artifacts/BlogHero-Mac/BlogHero-Mac.zip
